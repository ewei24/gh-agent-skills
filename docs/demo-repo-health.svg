<svg xmlns="http://www.w3.org/2000/svg" width="760" height="515" viewBox="0 0 760 515" role="img" aria-label="Example: an AI agent running the repo-health skill and reporting a score of 50/100 with the top fixes">
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:14px;white-space:pre} .l{opacity:0;animation:in .25s ease-out forwards} @keyframes in{to{opacity:1}}</style>
<rect width="760" height="515" rx="10" fill="#0d1117"/>
<rect width="760" height="34" rx="10" fill="#161b22"/><rect y="24" width="760" height="10" fill="#161b22"/>
<circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/>
<text x="380.0" y="22" fill="#8b949e" text-anchor="middle" style="font-size:12px">~/my-app</text>
<text class="l" x="24" y="66" style="animation-delay:0.15s" xml:space="preserve"><tspan fill="#bc8cff" font-weight="600">&gt; </tspan><tspan fill="#e6edf3" font-weight="600">give this repo a health check</tspan></text>
<text class="l" x="24" y="108" style="animation-delay:0.84s" xml:space="preserve"><tspan fill="#3fb950">● </tspan><tspan fill="#8b949e">Using skill </tspan><tspan fill="#58a6ff" font-weight="600">repo-health</tspan></text>
<text class="l" x="24" y="129" style="animation-delay:0.96s" xml:space="preserve"><tspan fill="#8b949e">  $ python3 scripts/repo_health.py .</tspan></text>
<text class="l" x="24" y="171" style="animation-delay:1.20s" xml:space="preserve"><tspan fill="#e6edf3" font-weight="600">  Repo health: </tspan><tspan fill="#e6edf3" font-weight="600">my-app</tspan><tspan fill="#8b949e">                      Score </tspan><tspan fill="#f85149" font-weight="600">38/100 (F)</tspan></text>
<text class="l" x="24" y="213" style="animation-delay:1.44s" xml:space="preserve"><tspan fill="#8b949e">  Security     </tspan><tspan fill="#f85149" font-weight="600">✗ </tspan><tspan fill="#e6edf3">AWS access key in config/dev.env:2, and the .env file is committed</tspan></text>
<text class="l" x="24" y="234" style="animation-delay:1.56s" xml:space="preserve"><tspan fill="#8b949e">  Docs         </tspan><tspan fill="#f85149" font-weight="600">✗ </tspan><tspan fill="#e6edf3">no LICENSE   </tspan><tspan fill="#d29922" font-weight="600">! </tspan><tspan fill="#e6edf3">README is only 45 words</tspan></text>
<text class="l" x="24" y="255" style="animation-delay:1.68s" xml:space="preserve"><tspan fill="#8b949e">  Engineering  </tspan><tspan fill="#3fb950" font-weight="600">✓ </tspan><tspan fill="#e6edf3">CI   </tspan><tspan fill="#f85149" font-weight="600">✗ </tspan><tspan fill="#e6edf3">no tests   </tspan><tspan fill="#d29922" font-weight="600">! </tspan><tspan fill="#e6edf3">no lockfile</tspan></text>
<text class="l" x="24" y="276" style="animation-delay:1.80s" xml:space="preserve"><tspan fill="#8b949e">  Community    </tspan><tspan fill="#d29922" font-weight="600">! </tspan><tspan fill="#e6edf3">no CONTRIBUTING, SECURITY, templates</tspan></text>
<text class="l" x="24" y="297" style="animation-delay:1.92s" xml:space="preserve"><tspan fill="#8b949e">  Activity     </tspan><tspan fill="#3fb950" font-weight="600">✓ </tspan><tspan fill="#e6edf3">last commit today</tspan></text>
<text class="l" x="24" y="339" style="animation-delay:2.16s" xml:space="preserve"><tspan fill="#3fb950">● </tspan><tspan fill="#e6edf3" font-weight="600">Fix these first:</tspan></text>
<text class="l" x="24" y="360" style="animation-delay:2.28s" xml:space="preserve"><tspan fill="#8b949e">  1. </tspan><tspan fill="#f85149" font-weight="600">Rotate the AWS key now. </tspan><tspan fill="#e6edf3">Deleting the file is not enough:</tspan></text>
<text class="l" x="24" y="381" style="animation-delay:2.40s" xml:space="preserve"><tspan fill="#8b949e">     </tspan><tspan fill="#e6edf3">it stays in git history.</tspan></text>
<text class="l" x="24" y="402" style="animation-delay:2.52s" xml:space="preserve"><tspan fill="#8b949e">  2. </tspan><tspan fill="#e6edf3">Add a LICENSE. Which one do you want: MIT or Apache-2.0?</tspan></text>
<text class="l" x="24" y="423" style="animation-delay:2.64s" xml:space="preserve"><tspan fill="#8b949e">  3. </tspan><tspan fill="#e6edf3">Add tests. I can set up a first test with your CI.</tspan></text>
<text class="l" x="24" y="444" style="animation-delay:2.76s" xml:space="preserve"><tspan fill="#8b949e">  4. </tspan><tspan fill="#e6edf3">Add a Usage section and a lockfile (npm install).</tspan></text>
<text class="l" x="24" y="486" style="animation-delay:3.00s" xml:space="preserve"><tspan fill="#8b949e">  Want me to make fixes 2 to 4?</tspan></text>
</svg>